  .plx-f textarea { min-height:64px; resize:vertical; }

  .plx-check.green { background:#e5f5ec; color:#1d6b3f; } .plx-check.yellow { background:#fff4e0; color:#7a4a00; } .plx-check.red { background:#fdecea; color:#a12a1d; }
  .plx-seg2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  .plx-cl label { display:flex; gap:8px; align-items:center; min-height:36px; font-size:14px; }

  .plx-photos .ph button { position:absolute; top:2px; right:2px; width:22px; height:22px; border-radius:50%; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:12px; cursor:pointer; }
  .plx-pick { min-height:48px; border:1px dashed var(--accent); border-radius:10px; display:flex; align-items:center; justify-content:center; gap:6px; color:var(--accent-strong); font-weight:700; cursor:pointer; }

  /* แท็บเล็ต: ตัดคอลัมน์วันที่ลงบรรทัดใหม่ */
  @media (max-width: 1100px) {

  }
  /* มือถือ: การ์ดเต็มความกว้าง ปุ่มใหญ่ ≥ 44px ไม่ย่อตาราง */
  @media (max-width: 700px) {
    .plx-job { grid-template-columns: 12px 1fr; gap:6px 10px; padding:12px; }

    .plx-job .plx-dates { grid-column: 2; }
    .plx-right { flex-direction:row; justify-content:space-between; align-items:center; }
    .plx-right .plx-btn { min-height:44px; padding:0 16px; font-size:14px; }
    .plx-btn { min-height:44px; }
    .plx-bar select, .plx-bar input { height:44px; font-size:15px; }
    .plx-bar select { flex:1 1 40%; }

    .plx-kv { grid-template-columns:100px 1fr; }
    .plx-row2 { grid-template-columns:1fr; }
    .plx-f input[type=text], .plx-f input[type=date], .plx-f select, .plx-f textarea { font-size:16px; min-height:44px; }

    .plx-ev { font-size:13px; padding:8px; white-space:normal; }

</style>

<script>
(function () {
  "use strict";
  var PLX = window.PLX = {};
  var root, opts = {}, D = null, fromCache = false, loading = false, me = { role: "" };
  var view = "mine", month = "", stage = "", q = "", actAs = "";
  var cur = null, curHist = null, curSuggest = null, sending = false, pendPhotos = {};
  var curMsg = null; // ข้อความผลบันทึกล่าสุด · คงไว้ตอนวาดลิ้นชักใหม่ (กันหน้าเลื่อนแล้วกดพลาด)
  var CACHE_KEY = "plx_cache_v1", TOK_KEY = "plx_tok", EMAIL_KEY = "plx_email";
  // เข้าสู่ระบบ: token ได้จากรหัสทางอีเมล เก็บในเครื่อง ส่งไปกับทุกคำสั่ง (server ตรวจเองทุกครั้ง)
  var tok = "", needsLogin = false, login = { step: "email", email: "", msg: "", bad: false, busy: false };
  var MON = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  var DOW = ["จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส.", "อา."];
  var ERR_TEXT = {
    FORBIDDEN: "คุณไม่มีสิทธิ์ทำรายการนี้", BAD_STATE: "สถานะงานเปลี่ยนไปแล้ว ทำรายการนี้ไม่ได้",
    CONFLICT: "มีคนแก้งานนี้ไปก่อนแล้ว", NEED_REASON: "ต้องใส่เหตุผล", INVALID: "ข้อมูลไม่ถูกต้อง",
    OLD_ROW: "งานเดือนเก่า ระบบไม่แก้", NOT_FOUND: "ไม่พบงานนี้ในชีตแล้ว", AMBIGUOUS: "พบงานซ้ำหลายแถว",
    BUSY: "มีคนกำลังบันทึกอยู่ ลองใหม่อีกครั้ง", LOGIN_REQUIRED: "กรุณาเข้าสู่ระบบใหม่"
  };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function $(sel, el) { return (el || root).querySelector(sel); }
  function $$(sel, el) { return Array.prototype.slice.call((el || root).querySelectorAll(sel)); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { } }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function todayKey() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function addDaysKey(k, n) { var p = k.split("-"); var d = new Date(+p[0], +p[1] - 1, +p[2] + n, 12); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function dayDiff(a, b) { var pa = a.split("-"), pb = b.split("-"); return Math.round((new Date(+pb[0], +pb[1] - 1, +pb[2], 12) - new Date(+pa[0], +pa[1] - 1, +pa[2], 12)) / 864e5); }
  function th(k) { if (!k) return "–"; var p = k.split("-"); return (+p[2]) + " " + MON[+p[1] - 1]; }
  function thMonth(mk) { var p = mk.split("-"); return MON[+p[1] - 1] + " " + (+p[0] + 543); }
  function S() { return D ? D.status : {}; }

  // บทบาทที่ใช้แสดงผล: Admin เลือก "ดูในฐานะ" ได้ (แค่มุมมอง — server ยังตรวจสิทธิ์จริง)
  function role() { return me.role === "Admin" && actAs ? actAs : me.role; }
  function can(key, job) {
    if (!D || !D.actions[key]) return false;
    var a = D.actions[key], r = role();
    if (r !== "Admin" && a.roles.indexOf(r) < 0) return false;
    return a.from.indexOf(job.status || "") >= 0;
  }
  // การกระทำหลักของงานนี้ (ปุ่มบนการ์ด) ตามลำดับความสำคัญ
  var MAIN_ORDER = ["create", "ackLate", "plan", "shipDate", "shipped", "received", "installed", "proofSent"];
  function mainAction(job) {
    for (var i = 0; i < MAIN_ORDER.length; i++) {
      var k = MAIN_ORDER[i];
      // สถานะอื่นแก้แผน/วันส่งได้ในแผง แต่ไม่นับเป็นงานค้าง
      if (k === "plan" && job.status !== S().WAIT_MA) continue;
      if (k === "shipDate" && job.status !== S().WAIT_SHIP) continue;
      if (can(k, job)) return k;
    }
    return "";
  }

  function stepInfo(job) {
    var s = S(), st = job.status, a = ["", "", "", ""];
    if (st === s.WAIT_AE) a[0] = "w";
    if ([s.SCHEDULED, s.SHIPPED, s.RESHIP, s.RECEIVED, s.INSTALLED, s.INSTALLED_MANUAL, s.ON_AIR, s.CLOSED].indexOf(st) >= 0) a[0] = "d";
    if ([s.SHIPPED, s.RECEIVED, s.INSTALLED, s.INSTALLED_MANUAL, s.ON_AIR, s.CLOSED].indexOf(st) >= 0) a[1] = "d";
    if (st === s.RESHIP) a[1] = "x";
    if ([s.RECEIVED, s.INSTALLED, s.INSTALLED_MANUAL, s.ON_AIR, s.CLOSED].indexOf(st) >= 0) a[2] = "d";
    if ([s.INSTALLED, s.INSTALLED_MANUAL, s.ON_AIR, s.CLOSED].indexOf(st) >= 0) a[3] = "d";
    return a;
  }
  function pillCls(job) {
    var s = S(), st = job.status;
    if (!st) return "s-none";
    if (st === s.WAIT_AE || st === s.RESHIP) return "s-red";
    if (st === s.WAIT_MA || st === s.WAIT_SHIP) return "s-wait";
    if (st === s.ON_AIR || st === s.CLOSED || st === s.INSTALLED || st === s.INSTALLED_MANUAL) return "s-ok";
    return "s-go";
  }
  function dotCls(job) {
    if (!job.check || (!job.shipDate && !job.installDate)) return "plx-n";
    return { green: "plx-g", yellow: "plx-y", red: "plx-r" }[job.check.level] || "plx-n";
  }

  // วันที่ที่ใช้เรียงความเร่งด่วนของการกระทำ
  function dueOf(job, k) {
    if (k === "create" || k === "proofSent" || k === "ackLate") return job.adOn;
    if (k === "plan") return job.createdAt ? job.createdAt.slice(0, 10) : job.adOn;
    if (k === "shipDate") return job.installDate || job.adOn;
    if (k === "shipped") return job.shipDate;
    return job.installDate || job.adOn;
  }

  /* ------------------------- โหลดข้อมูล ------------------------- */
  function loadCache() {
    var raw = lsGet(CACHE_KEY);
    if (!raw) return;
    try { D = JSON.parse(raw); fromCache = true; me = D.me || me; } catch (e) { D = null; }
  }
  function refresh() {
    if (loading) return;
    loading = true;
    renderHead();
    google.script.run
      .withSuccessHandler(function (r) {
        loading = false;
        if (r && r.code === "LOGIN_REQUIRED") { requireLogin(tok ? "หมดเวลาเข้าสู่ระบบ หรือสิทธิ์ถูกยกเลิก กรุณาเข้าสู่ระบบใหม่" : ""); return; }
        if (!r || !r.ok) { renderAll(); toast((r && r.message) || "โหลดข้อมูลไม่สำเร็จ", true); return; }
        D = r; me = r.me; fromCache = false;
        if (needsLogin) { needsLogin = false; showLogin(false); }
        lsSet(CACHE_KEY, JSON.stringify(r));
        if (cur) { var j = findJob(cur.row, cur.sign); if (j) cur = j; }
        renderAll();
        if (cur && isOpen()) renderDrawer();
      })
      .withFailureHandler(function (e) { loading = false; renderAll(); toast("เชื่อมต่อไม่สำเร็จ: " + (e && e.message ? e.message : e), true); })
      .plCall(tok, "listPosterJobs", [{}]);
  }
  function findJob(row, sign) {
    if (!D) return null;
    for (var i = 0; i < D.jobs.length; i++) if (D.jobs[i].row === row && D.jobs[i].sign === sign) return D.jobs[i];
    for (var k = 0; k < D.jobs.length; k++) if (D.jobs[k].sign === sign && cur && D.jobs[k].monthKey === cur.monthKey) return D.jobs[k];
    return null;
  }
  function replaceJob(job) {
    if (!D) return;
    for (var i = 0; i < D.jobs.length; i++) {
      var o = D.jobs[i];
      if (o.sign === job.sign && o.monthKey === job.monthKey) {
        job.check = job.check || evaluate(job, curSuggest && curSuggest.buffer);
        job.createdAt = job.createdAt || o.createdAt;
        job.week = job.week || o.week;
        job.slaOverdue = job.status === S().WAIT_MA && o.slaOverdue;
        D.jobs[i] = job;
        return;
      }
    }
  }
  // ประเมินวันแบบเดียวกับ server (plEvaluate_) ใช้แสดงผลทันทีก่อนกดบันทึก
  function evaluate(j, buffer) {
    var b = buffer == null ? 2 : buffer, issues = [], level = "green";
    if (j.shipDate && j.installDate && j.shipDate > j.installDate) { level = "red"; issues.push("วันส่งอยู่หลังวันติดตั้ง"); }
    if (j.installDate && j.adOn && j.installDate > j.adOn) { level = "red"; issues.push("ติดตั้งหลังวัน Ad on"); }
    if (j.shipDate && j.installDate && j.shipDate <= j.installDate) {
      var gap = dayDiff(j.shipDate, j.installDate);
      if (gap < b) { if (level === "green") level = "yellow"; issues.push("ส่ง→ติดตั้ง " + gap + " วัน น้อยกว่า buffer " + b + " วัน"); }
    }
    return { level: level, issues: issues };
  }

  /* ------------------------- เข้าสู่ระบบ ------------------------- */
  // ซ่อน/แสดงส่วนงาน กับกล่องเข้าสู่ระบบ
  function showLogin(on) {
    [".plx-vseg-wrap", ".plx-bar", ".plx-chips", ".plx-list"].forEach(function (sel) { var el = $(sel); if (el) el.style.display = on ? "none" : ""; });
    var box = $(".plx-loginbox");
    if (box) box.style.display = on ? "" : "none";
  }
  // ล้าง token + ข้อมูลงานที่ค้างในเครื่อง แล้วเปิดกล่องเข้าสู่ระบบ
  function requireLogin(msg) {
    if (!root) return;
    tok = ""; lsDel(TOK_KEY); lsDel(CACHE_KEY);
    D = null; fromCache = false; me = { role: "" }; actAs = "";
    if (isOpen()) closeDrawer();
    var was = needsLogin;
    needsLogin = true;
    if (!was || msg) { login.step = "email"; login.msg = msg || ""; login.bad = false; login.busy = false; }
    showLogin(true);
    renderHead();
    renderLogin();
  }
  function renderLogin() {
    var box = $(".plx-loginbox");
    if (!box) return;
    var m = login.msg ? '<div class="plx-msg ' + (login.bad ? "err" : "ok") + '">' + esc(login.msg) + "</div>" : "";
    var h;
    if (login.step === "email") {
      h = '<form class="plx-login" novalidate><h3>เข้าสู่ระบบ</h3>' +
        "<p>กรอกอีเมลที่ลงทะเบียนไว้กับ Admin ระบบจะส่งรหัส 6 หลักไปให้ทางอีเมล</p>" + m +
        '<input type="email" name="email" autocomplete="email" inputmode="email" placeholder="you@example.com" aria-label="อีเมล" value="' + esc(login.email) + '">' +
        '<button type="submit" class="plx-btn pri"' + (login.busy ? " disabled" : "") + ">" + (login.busy ? "กำลังส่งรหัส…" : "ส่งรหัสเข้าสู่ระบบ") + "</button></form>";
    } else {
      h = '<form class="plx-login" novalidate><h3>กรอกรหัส 6 หลัก</h3>' +
        "<p>รหัสถูกส่งไปที่ <b>" + esc(login.email) + "</b> ใช้ได้ 10 นาที</p>" + m +
        '<input type="text" name="code" class="code" autocomplete="one-time-code" inputmode="numeric" maxlength="6" placeholder="••••••" aria-label="รหัส 6 หลัก">' +
        '<button type="submit" class="plx-btn pri"' + (login.busy ? " disabled" : "") + ">" + (login.busy ? "กำลังตรวจรหัส…" : "เข้าสู่ระบบ") + "</button>" +
        '<div class="alt"><button type="button" data-l="resend">ขอรหัสใหม่</button><button type="button" data-l="change">เปลี่ยนอีเมล</button></div></form>';
    }
    box.innerHTML = h;
    var form = $("form", box), inp = $("input", box);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (login.busy) return;
      if (login.step === "email") sendCode(inp.value); else verifyCode(inp.value);
    });
    var rs = $('[data-l="resend"]', box), ch = $('[data-l="change"]', box);
    if (rs) rs.addEventListener("click", function () { if (!login.busy) sendCode(login.email); });
    if (ch) ch.addEventListener("click", function () { login.step = "email"; login.msg = ""; renderLogin(); });
    if (!login.busy) { try { inp.focus(); } catch (e) { } }
  }
  function authCall(fn, args, cb) {
    var r = google.script.run
      .withSuccessHandler(cb)
      .withFailureHandler(function (e) { cb({ ok: false, message: "เชื่อมต่อไม่สำเร็จ: " + (e && e.message ? e.message : e) }); });
    r[fn].apply(r, args);
  }
  function sendCode(email) {
    email = String(email || "").trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { login.msg = "กรอกอีเมลให้ถูกต้อง"; login.bad = true; renderLogin(); return; }
    login.email = email; lsSet(EMAIL_KEY, email);
    login.busy = true; login.msg = ""; renderLogin();
    authCall("plAuthRequestCode", [email], function (r) {
      login.busy = false;
      if (r && r.ok) { login.step = "code"; login.msg = r.message || "ส่งรหัสแล้ว"; login.bad = false; }
      else { login.msg = (r && r.message) || "ส่งรหัสไม่สำเร็จ"; login.bad = true; }
      renderLogin();
    });
  }
  function verifyCode(code) {
    code = String(code || "").replace(/\D/g, "");
    if (code.length !== 6) { login.msg = "กรอกรหัสให้ครบ 6 หลัก"; login.bad = true; renderLogin(); return; }
    login.busy = true; login.msg = ""; renderLogin();
    authCall("plAuthVerifyCode", [login.email, code], function (r) {
      login.busy = false;
      if (r && r.ok && r.token) {
        tok = r.token; lsSet(TOK_KEY, tok);
        me = r.me || me;
        login.step = "email"; login.msg = "";
        needsLogin = false; showLogin(false);
        renderAll();
        refresh();
        return;
      }
      login.msg = (r && r.message) || "เข้าสู่ระบบไม่สำเร็จ"; login.bad = true;
      renderLogin();
    });
  }

  /* ------------------------- วาดหน้าหลัก ------------------------- */
  PLX.mount = function (el, o) {

      '<div class="plx">' +
        '<div class="bl-card"><div class="plx-head"><div><div class="bl-title">🚚 ติดตามขนส่ง Poster</div><div class="plx-who"></div><div class="plx-src"></div></div>' +
        '<div class="plx-hbtns"><button type="button" class="plx-btn" data-a="refresh">🔄 รีเฟรช</button><button type="button" class="plx-btn" data-a="logout" style="display:none">ออกจากระบบ</button><button type="button" class="plx-btn" data-a="back">← มุมมองเดิม</button></div></div>' +
        '<div class="plx-testbox"></div>' +
        '<div class="plx-vseg-wrap"><div class="bl-vseg" role="tablist"></div></div>' +
        '<div class="plx-bar"></div><div class="plx-chips"></div></div>' +
        '<div class="plx-list"></div>' +
        '<div class="bl-card plx-loginbox" style="display:none"></div>' +
      '</div>' +
      '<div class="plx-back"></div><aside class="plx-drawer" aria-hidden="true"><div class="plx-dh"><div class="t"></div><button type="button" class="plx-x" aria-label="ปิด">✕</button></div><div class="plx-db"></div></aside>' +
      '<div class="plx-toast"></div>';
    $('[data-a="refresh"]').addEventListener("click", refresh);
    $('[data-a="logout"]').addEventListener("click", function () { requireLogin("ออกจากระบบแล้ว"); });
    tok = lsGet(TOK_KEY) || "";
    login.email = lsGet(EMAIL_KEY) || "";
    $('[data-a="back"]').addEventListener("click", function () { closeDrawer(); if (opts.back) opts.back(); });
    $(".plx-back").addEventListener("click", closeDrawer);
    $(".plx-x").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && isOpen()) closeDrawer(); });
    loadCache();
    renderAll();
    refresh();
  };
  PLX.show = function () { if (root) { renderAll(); refresh(); } };

  function renderHead() {
    if (!root) return;
    var who = me && me.email ? (esc(me.name || me.email) + " · บทบาท " + esc(me.role || "ไม่มีในรายชื่อ Users (ดูได้อย่างเดียว)")) : "กำลังตรวจผู้ใช้…";
    if (needsLogin) who = "ยังไม่ได้เข้าสู่ระบบ";
    $(".plx-who").innerHTML = who;
    $('[data-a="logout"]').style.display = !needsLogin && me && me.via === "otp" ? "" : "none";
    var src = $(".plx-src");
    if (loading) { src.className = "plx-src"; src.textContent = D ? "กำลังโหลดข้อมูลล่าสุด…" + (fromCache ? " (ตอนนี้แสดงข้อมูลจาก cache " + D.fetchedAt + ")" : "") : "กำลังโหลด…"; }
    else if (D) { src.className = "plx-src" + (fromCache ? " cache" : ""); src.textContent = (fromCache ? "ข้อมูลจาก cache " : "ข้อมูลล่าสุดจากชีต ") + D.fetchedAt; }
    if (needsLogin || (!loading && !D)) { src.className = "plx-src"; src.textContent = ""; }
    $(".plx-testbox").innerHTML = D && D.testMode ? '<div class="plx-test">โหมดทดสอบ: ระบบกำลังอ่าน/เขียน "สำเนาชีต" ไม่ใช่ชีตจริง</div>' : "";
  }

  function renderAll() {
    if (!root) return;
    renderHead();
    if (needsLogin) return;
    var V = [["mine", "งานของฉัน"], ["all", "ทุกงาน"], ["cal", "ปฏิทิน"], ["ship", "จุดจัดส่ง"]];
    var seg = $(".bl-vseg");
    seg.innerHTML = V.map(function (v) { return '<button type="button" data-v="' + v[0] + '" class="' + (view === v[0] ? "on" : "") + '">' + v[1] + "</button>"; }).join("");
    $$("button", seg).forEach(function (b) { b.addEventListener("click", function () { view = b.getAttribute("data-v"); lsSet("plx_view", view); renderAll(); }); });
    if (!D) { $(".plx-list").innerHTML = '<div class="bl-card"><div class="plx-empty">กำลังโหลดงาน…</div></div>'; $(".plx-bar").innerHTML = ""; $(".plx-chips").innerHTML = ""; return; }

    // เดือน: ค่าเริ่มต้น = เดือนนี้ (ถ้ามีงาน) ไม่งั้นเดือนแรกที่มี
    var months = {};
    D.jobs.forEach(function (j) { months[j.monthKey] = 1; });
    var ml = Object.keys(months).sort();
    var tk = todayKey().slice(0, 7);
    if (!month || !months[month]) month = months[tk] ? tk : (ml[0] || "");
    var bar = '<select data-f="month" aria-label="เดือน">' + ml.map(function (m) { return '<option value="' + m + '"' + (m === month ? " selected" : "") + ">" + thMonth(m) + "</option>"; }).join("") + "</select>" +
      '<input type="search" data-f="q" placeholder="ค้นหา รหัสป้าย / ลูกค้า / สนามบิน" value="' + esc(q) + '">';
    if (me.role === "Admin") {
      bar += '<select data-f="as" aria-label="ดูในฐานะ"><option value="">ดูในฐานะ: Admin</option>' +
        ["AE", "Ops", "Production", "MA", "Installer"].map(function (r) { return '<option value="' + r + '"' + (actAs === r ? " selected" : "") + ">ดูในฐานะ: " + r + "</option>"; }).join("") + "</select>";
    }
    $(".plx-bar").innerHTML = bar;
    $('[data-f="month"]').addEventListener("change", function (e) { month = e.target.value; renderAll(); });
    var qi = $('[data-f="q"]');
    qi.addEventListener("input", function () { q = qi.value; renderList(); renderChips(); });
    var asSel = $('[data-f="as"]');
    if (asSel) asSel.addEventListener("change", function (e) { actAs = e.target.value; renderAll(); if (isOpen()) renderDrawer(); });
    renderChips();
    renderList();
  }

  function baseJobs() {
    var ql = q.trim().toLowerCase();
    return D.jobs.filter(function (j) {
      if (j.monthKey !== month) return false;
      if (ql && (j.sign + " " + j.customer + " " + j.airport + " " + j.iata).toLowerCase().indexOf(ql) < 0) return false;
      return true;
    });
  }
  var STAGES = [
    ["sla", "ต้องตามงาน", function (j) { return j.slaOverdue; }],
    ["red", "วันไม่สมเหตุสมผล", function (j) { return j.check && j.check.level === "red"; }],
    ["new", "ยังไม่สร้างงาน", function (j) { return !j.status; }],
    ["WAIT_MA"], ["WAIT_SHIP"], ["WAIT_AE"], ["SCHEDULED"], ["SHIPPED"], ["RESHIP"], ["RECEIVED"], ["INSTALLED"], ["INSTALLED_MANUAL"], ["ON_AIR"], ["CLOSED"]
  ];
  function stageTest(st) {
    if (st[2]) return st[2];
    var name = S()[st[0]];
    return function (j) { return j.status === name; };
  }
  function renderChips() {
    var list = baseJobs();
    var html = STAGES.map(function (st) {
      var n = list.filter(stageTest(st)).length;
      if (!n && stage !== st[0]) return "";
      var label = st[1] || S()[st[0]];
      return '<button type="button" class="bl-chip' + (stage === st[0] ? " on" : "") + '" data-s="' + st[0] + '">' + esc(label) + " <b>" + n + "</b></button>";
    }).join("");
    var c = $(".plx-chips");
    c.innerHTML = html;
    $$("button", c).forEach(function (b) { b.addEventListener("click", function () { var s = b.getAttribute("data-s"); stage = stage === s ? "" : s; renderChips(); renderList(); }); });
  }
  function filtered() {
    var list = baseJobs();
    if (stage) { var st = STAGES.filter(function (x) { return x[0] === stage; })[0]; if (st) list = list.filter(stageTest(st)); }
    return list;
  }

  function jobHtml(j, actKey) {
    var steps = stepInfo(j);
    var k = actKey != null ? actKey : mainAction(j);
    var btn = k ? '<button type="button" class="plx-btn pri" data-act="' + k + '">' + esc(D.actions[k].label) + "</button>" : "";
    var flags = [];
    if (j.slaOverdue) flags.push("เกิน SLA");
    if (j.check && j.check.level === "red") flags.push(j.check.issues[0] || "วันมีปัญหา");
    return '<div class="plx-job' + (cur && cur.sign === j.sign && cur.monthKey === j.monthKey ? " sel" : "") + '" data-row="' + j.row + '" data-sign="' + esc(j.sign) + '">' +
      '<span class="plx-dot ' + dotCls(j) + '" title="' + esc(j.check ? j.check.issues.join(", ") : "") + '"></span>' +
      '<div><div class="plx-sign">' + esc(j.sign) + '</div><div class="plx-sub">' + esc(j.airport || j.iata) + " · " + esc(j.customer || "–") + (j.version ? " (" + esc(j.version) + ")" : "") + "</div></div>" +
      '<div><div class="plx-steps">' + steps.map(function (s) { return "<i class=\"" + s + "\"></i>"; }).join("") + '</div><div class="plx-stl"><span>ยืนยัน</span><span>ส่ง</span><span>รับ</span><span>ติดตั้ง</span></div></div>' +
      '<div class="plx-dates"><span>ส่ง <b>' + th(j.shipDate) + "</b></span><span>ติดตั้ง <b>" + th(j.installDate) + "</b></span><span>Ad on <b>" + th(j.adOn) + "</b></span>" + (j.team ? "<span>ทีม <b>" + esc(j.team) + "</b></span>" : "") + "</div>" +
      '<div class="plx-right"><span class="plx-pill ' + pillCls(j) + '">' + esc(j.status || "ยังไม่สร้างงาน") + "</span>" + (flags.length ? '<span class="plx-flag">' + esc(flags.join(" · ")) + "</span>" : "") + btn + "</div>" +
      "</div>";
  }

  function renderList() {
    var box = $(".plx-list");
    var list = filtered();
    var html = "";
    // เลือกชิปสถานะแล้ว → แสดงทุกงานในสถานะนั้น (ให้ตรงกับตัวเลขบนชิป) แม้บทบาทนี้ไม่ต้องกดอะไร
    if (view === "mine" && !stage) html = mineHtml(list);
    else if (view === "cal") html = calHtml(list);
    else if (view === "ship") html = groupHtml(list, function (j) { return j.shipTo || "(ยังไม่ระบุจุดจัดส่ง)"; }, function (a, b) { return a < b ? -1 : 1; });
    else html = groupHtml(list, function (j) { return (j.customer || "(ไม่ระบุลูกค้า)") + "\u0001" + (j.week || ""); }, function (a, b) {
      var wa = a.split("\u0001")[1] || "9999", wb = b.split("\u0001")[1] || "9999";
      return wa < wb ? -1 : wa > wb ? 1 : a < b ? -1 : 1;
    });
    box.innerHTML = html || '<div class="bl-card"><div class="plx-empty">ไม่มีงานตามตัวกรองนี้</div></div>';
    $$(".plx-job, .plx-ev", box).forEach(function (el) {
      el.addEventListener("click", function (ev) {
        var j = findJobBy(el.getAttribute("data-row"), el.getAttribute("data-sign"));
        if (!j) return;

        openDrawer(j, act ? act.getAttribute("data-act") : "");
      });
    });
  }
  function findJobBy(row, sign) {
    row = +row;
    for (var i = 0; i < D.jobs.length; i++) if (D.jobs[i].row === row && D.jobs[i].sign === sign) return D.jobs[i];
    return null;
  }
  function weekLabel(w) { return w ? "สัปดาห์ " + th(w) + " – " + th(addDaysKey(w, 6)) : "ยังไม่มีวัน"; }
  function groupHtml(list, keyFn, sortFn) {
    var g = {};
    list.forEach(function (j) { var k = keyFn(j); (g[k] = g[k] || []).push(j); });
    return Object.keys(g).sort(sortFn).map(function (k) {
      var parts = k.split("\u0001");
      var head = parts.length > 1 ? esc(parts[0]) + " <span>" + weekLabel(parts[1]) + "</span>" : esc(parts[0]);
      var items = g[k].sort(function (a, b) { return (a.installDate || a.adOn || "9") < (b.installDate || b.adOn || "9") ? -1 : 1; });
      return '<div class="plx-grp"><div class="plx-gh"><div>' + head + "</div><span>" + items.length + " ป้าย</span></div>" + items.map(function (j) { return jobHtml(j); }).join("") + "</div>";
    }).join("");
  }
  // งานของฉัน: งานที่บทบาทนี้ต้องกด เรียงตามความเร่งด่วน แยก เลยกำหนด / วันนี้ / พรุ่งนี้ / ถัดไป
  function mineHtml(list) {
    var r = role();
    if (!r) return '<div class="bl-card"><div class="plx-empty">บัญชีนี้ยังไม่มีบทบาทในแท็บ Users จึงดูได้อย่างเดียว — ใช้มุมมอง "ทุกงาน"</div></div>';
    var t = todayKey(), tm = addDaysKey(t, 1);
    var items = [];
    list.forEach(function (j) { var k = mainAction(j); if (k) items.push({ j: j, k: k, due: dueOf(j, k) || "9999" }); });
    // งานที่ยังไม่สร้าง แสดงเฉพาะที่ Ad on ภายใน 21 วัน ไม่งั้นรายการยาวเกิน
    items = items.filter(function (x) { return x.k !== "create" || (x.due !== "9999" && dayDiff(t, x.due) <= 21) || !x.j.adOn; });
    items.sort(function (a, b) { return (b.j.slaOverdue ? 1 : 0) - (a.j.slaOverdue ? 1 : 0) || (a.due < b.due ? -1 : a.due > b.due ? 1 : 0); });
    if (!items.length) return '<div class="bl-card"><div class="plx-empty">ไม่มีงานค้างของคุณในเดือนนี้ 🎉</div></div>';

  // ย่อรูปฝั่งเครื่อง: ด้านยาวไม่เกิน 1600px แปลงเป็น JPEG
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      if (!/^image\//.test(file.type || "image/")) { reject(new Error("ไฟล์ " + file.name + " ไม่ใช่รูป")); return; }
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.round(w * sc); c.height = Math.round(h * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("เปิดรูป " + file.name + " ไม่ได้")); };
      img.src = url;
    });
  }

  }

  function showFormMsg(cls, html) {
    var box = $(".plx-db .plx-formmsg");
    curMsg = html ? { cls: cls, html: html } : null;
    box.innerHTML = html ? '<div class="plx-msg ' + cls + '">' + html + "</div>" : "";
    if (html) box.scrollIntoView({ block: "nearest" });
  }

  function doAction(key, f) {
    if (sending) return;
    var j = cur;
    var btn = f.querySelector('button[type="submit"]');
    var payload = {}, err = "";
    if (key === "create") { payload.adOn = f.adOn.value; if (!payload.adOn) err = "กรุณาเลือกวัน Ad on"; }
    if (key === "updateAdOn") { payload.adOn = f.adOn.value; payload.reason = f.reason.value.trim(); if (!payload.adOn) err = "กรุณาเลือกวัน Ad on"; }
    if (key === "plan") {
      ["shipTo", "receiver", "installDate", "team", "reason"].forEach(function (n) { payload[n] = f[n].value.trim(); });
      if (!payload.shipTo || !payload.installDate) err = "กรุณากรอกจุดจัดส่ง และวันติดตั้ง";
    }
    if (key === "shipDate") {
      payload.shipDate = f.shipDate.value;
      payload.reason = f.reason ? f.reason.value.trim() : "";
      if (!payload.shipDate) err = "กรุณาเลือกวันจัดส่ง";
    }
    if (key === "shipped") { payload.tracking = f.tracking.value.trim(); payload.note = f.note.value.trim(); if (!payload.tracking) err = "กรุณาใส่ขนส่ง / เลขพัสดุ"; }
    if (key === "received") {
      var c = f.querySelector('input[name="condition"]:checked');
      payload.condition = c ? c.value : ""; payload.note = f.note.value.trim();
      if (!payload.condition) err = "กรุณาเลือก ครบ หรือ เสียหาย";
      else if (payload.condition === "เสียหาย" && !payload.note) err = "ของเสียหาย กรุณาบอกอาการในหมายเหตุ";
    }
    if (key === "installed") {
      payload.note = f.note.value.trim();
      payload.checklist = $$('input[name="checklist"]:checked', f).map(function (x) { return x.value; });
      if (!(pendPhotos.installed || []).length && !j.photoList.length && !confirm("ยังไม่มีรูปติดตั้ง ระบบจะยังไม่ติ๊ก Status ยืนยันบันทึกหรือไม่?")) return;
    }
    if (err) { showFormMsg("err", esc(err)); return; }

    sending = true;
    var oldText = btn.textContent;
    btn.disabled = true; btn.textContent = "กำลังบันทึก…";
    $$(".plx-db button").forEach(function (b) { b.disabled = true; });
    showFormMsg("", "");
    var progress = function (t) { btn.textContent = t; };
    var chain = (key === "installed" || key === "received") && (pendPhotos[key] || []).length
      ? uploadAll(key, j, progress).then(function (urls) { payload.photoUrls = urls; })
      : Promise.resolve();
    chain.then(function () {
      progress("กำลังบันทึก…");
      var fn = { create: "createJob", updateAdOn: "updateAdOn", plan: "planInstall", shipDate: "setShipDate", ackLate: "acknowledgeLate", shipped: "markShipped", received: "markReceived", installed: "markInstalled", proofSent: "markProofSent" }[key];
      return (key === "ackLate" || key === "proofSent") ? gs(fn, j.rowKey, j.ver) : gs(fn, j.rowKey, payload, j.ver);
    }).then(function (r) { done(r); }, function (e) { done(e && e.code ? e : { ok: false, code: "ERROR", message: (e && e.message) || String(e) }); });

    function done(r) {
      sending = false;
      if (r && r.ok) {
        pendPhotos[key] = [];
        replaceJob(r.job);
        cur = findJob(r.job.row, r.job.sign) || r.job;
        if (r.suggest) curSuggest = r.suggest;
        lsSet(CACHE_KEY, JSON.stringify(D));
        renderChips(); renderList(); renderDrawer();
        var warn = (r.warnings || []).filter(String);
        showFormMsg(warn.length ? "warn" : "ok", "บันทึกแล้ว ✔" + (warn.length ? "<br>" + esc(warn.join(" · ")) : "") +
          (key === "create" && r.suggest ? "<br>ค่าแนะนำ: ติดตั้ง " + th(r.suggest.installDate) + " · ส่ง " + th(r.suggest.shipDate) : ""));
        toast("บันทึกแล้ว: " + D.actions[key].label);
        loadDetail();
        return;
      }
      btn.disabled = false; btn.textContent = oldText;
      $$(".plx-db button").forEach(function (b) { b.disabled = false; });
      var code = r && r.code, msg = esc((r && r.message) || "บันทึกไม่สำเร็จ");
      if (code === "CONFLICT") {
        showFormMsg("err", "<b>" + ERR_TEXT.CONFLICT + "</b><br>" + msg + '<br><button type="button" class="plx-btn" data-a="reload" style="margin-top:8px">โหลดค่าล่าสุด</button>');
        conflictJob = r.job || null;
        bindReload();
      } else {
        showFormMsg("err", "<b>" + esc(ERR_TEXT[code] || "บันทึกไม่สำเร็จ") + "</b><br>" + msg);
        if (r && r.job) { replaceJob(r.job); }
      }
    }
  }

  var toastT = null;
  function toast(t, bad) {
    var el = $(".plx-toast");
    if (!el) return;
    el.textContent = t;
    el.style.background = bad ? "#a12a1d" : "#10294a";
    el.style.display = "block";
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.style.display = "none"; }, 3500);
  }
})();
</script>
